<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile Draft</title><style>
:root{--ink:#23334a;--accent:#315cce;--line:#dbe2ed}*{box-sizing:border-box}body{margin:0;background:#f0f3f8;color:var(--ink);font:16px/1.5 system-ui,sans-serif}header,main{width:min(1120px,94%);margin:auto}header{padding:30px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}header p{margin:0;color:#64748b;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:start;padding-bottom:40px}.editor,.sheet{background:white;border:1px solid var(--line);border-radius:14px;padding:28px}h1{font:36px/1.2 Georgia,serif;margin:0 0 12px}h2{font-size:16px;margin:26px 0 12px}label{display:block;margin:16px 0 6px;font-size:14px;font-weight:600}input,textarea{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;font:inherit;color:inherit;background:white}textarea{min-height:80px;resize:vertical}button{cursor:pointer;padding:10px 16px;border:1px solid var(--line);border-radius:8px;font:inherit;background:white;color:var(--ink)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}:focus-visible{outline:3px solid #93b4ff;outline-offset:2px}.entry{border-top:1px solid var(--line);margin-top:20px;padding-bottom:16px}.entry button{margin-top:8px}.sheet{min-height:540px;box-shadow:0 12px 35px #23334a0b}.sheet p,.sheet li{white-space:pre-wrap;overflow-wrap:anywhere}.sheet h2{border-bottom:1px solid var(--line);padding-bottom:8px;color:var(--accent)}@media(max-width:750px){main{grid-template-columns:1fr}.editor,.sheet{padding:20px}header{align-items:start}.sheet{min-height:350px}}@media print{header,.editor{display:none}body{background:white}main{display:block;width:100%;padding:0}.sheet{border:0;box-shadow:none;padding:0;border-radius:0}}
</style></head><body><header><div><strong>Profile Draft</strong><p>Your experience, clearly presented.</p></div><button id="print" class="primary" type="button">Print resume</button></header><main><section class="editor" aria-label="Resume editor"><h1>Make it yours.</h1><p>Only information you enter appears in your resume.</p><label for="name">Full name</label><input id="name" autocomplete="name"><label for="role">Job title</label><input id="role"><label for="skills">Skills</label><textarea id="skills"></textarea><h2>Experience</h2><div id="entries"></div><button id="add" type="button">Add experience</button></section><article class="sheet" aria-label="Resume preview"><h1 id="preview-name">Your name</h1><p id="preview-role"></p><h2>Skills</h2><p id="preview-skills"></p><h2>Experience</h2><ul id="preview-experience"></ul></article></main><script>
const byId=id=>document.getElementById(id);let sequence=0;
function update(){byId('preview-name').textContent=byId('name').value||'Your name';byId('preview-role').textContent=byId('role').value;byId('preview-skills').textContent=byId('skills').value;const list=byId('preview-experience');list.replaceChildren();document.querySelectorAll('#entries textarea').forEach(field=>{if(field.value.trim()){const item=document.createElement('li');item.textContent=field.value;list.appendChild(item)}})}
['name','role','skills'].forEach(id=>byId(id).addEventListener('input',update));
byId('add').addEventListener('click',()=>{const entry=document.createElement('div');entry.className='entry';const label=document.createElement('label');const field=document.createElement('textarea');field.id='experience-'+(++sequence);label.htmlFor=field.id;label.textContent='Role, organization and achievements';const remove=document.createElement('button');remove.type='button';remove.textContent='Remove experience';remove.addEventListener('click',()=>{entry.remove();update()});field.addEventListener('input',update);entry.append(label,field,remove);byId('entries').appendChild(entry);field.focus()});
byId('print').addEventListener('click',()=>window.print());update();
</script></body></html>
